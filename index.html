<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Progress</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bounce-slow {
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .fade-in {
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center px-4">
  <div class="text-center fade-in">
    <div class="text-6xl mb-6">
      🚧
    </div>
    <h1 class="text-4xl font-bold mb-4">Halaman Desa Digital Sedang Dalam Proses</h1>
    <p class="text-gray-300 mb-8">Kami sedang bekerja keras membangun sesuatu yang luar biasa. Silakan kembali lagi nanti ya!</p>
    <div class="relative w-24 h-24 mx-auto mb-8">
      <div class="absolute inset-0 bg-yellow-400 rounded-full opacity-30 blur-xl animate-ping"></div>
      <div class="w-full h-full bg-yellow-500 rounded-full flex items-center justify-center bounce-slow">
        🚀
      </div>
    </div>
    <button onclick="alert('Terima kasih atas kesabaran Anda!')" class="px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-black rounded-xl shadow-md transition duration-300">
      Kirim Pesan
    </button>
  </div>
</body>
</html>
